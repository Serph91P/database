name: Sync Upstream & Apply Overrides

on:
  # Täglich um 06:00 UTC automatisch ausführen
  schedule:
    - cron: "0 6 * * *"
  # Manuell auslösbar über GitHub UI
  workflow_dispatch:

jobs:
  sync-and-override:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/Dictionarry-Hub/database.git || true
          git fetch upstream

      - name: Merge Upstream Changes
        id: merge
        run: |
          if git merge upstream/stable --no-edit -X theirs; then
            echo "merged=true" >> $GITHUB_OUTPUT
            echo "✅ Upstream merge successful"
          else
            echo "⚠️ Merge conflict, resolving..."
            git checkout --ours .github/workflows/sync-upstream.yml || true
            git add .github/workflows/sync-upstream.yml || true
            git commit --no-edit || true
            echo "merged=true" >> $GITHUB_OUTPUT
          fi

      - name: Remove upstream-only workflows
        if: steps.merge.outputs.merged == 'true'
        run: |
          # notify.yml braucht Secrets die nur im Original-Repo existieren
          rm -f .github/workflows/notify.yml
          rm -f .github/workflows/devSync.yml
          echo "✅ Removed upstream-only workflows"

      - name: Apply Custom Overrides
        if: steps.merge.outputs.merged == 'true'
        run: |
          echo "Applying overrides to profiles..."

          # ── 2160p Remux: Sprache auf Deutsch + Umbenennung ──
          yq -i '.language = "must_german"' 'profiles/2160p Remux.yml'
          yq -i '.name = "Deutsch - 2160p Remux"' 'profiles/2160p Remux.yml'
          mv 'profiles/2160p Remux.yml' 'profiles/Deutsch - 2160p Remux.yml'
          echo "✅ 2160p Remux → Deutsch - 2160p Remux (language: must_german)"

          # ── Weitere Overrides hier ergänzen, z.B.: ──
          # yq -i '.language = "must_german" | .name = "Deutsch - 1080p Quality"' 'profiles/1080p Quality.yml'
          # mv 'profiles/1080p Quality.yml' 'profiles/Deutsch - 1080p Quality.yml'

      - name: Commit & Push
        if: steps.merge.outputs.merged == 'true'
        run: |
          if git diff --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git add -A
            git commit -m "chore: sync upstream + apply custom overrides"
            git push origin $(git branch --show-current)
          fi
