name: Sync Upstream & Apply Overrides

on:
  # Täglich um 06:00 UTC automatisch ausführen
  schedule:
    - cron: "0 6 * * *"
  # Manuell auslösbar über GitHub UI
  workflow_dispatch:

jobs:
  sync-and-override:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/Dictionarry-Hub/database.git || true
          git fetch upstream

      - name: Merge Upstream Changes
        id: merge
        run: |
          if git merge upstream/stable --no-edit -X theirs; then
            echo "merged=true" >> $GITHUB_OUTPUT
            echo "✅ Upstream merge successful"
          else
            echo "⚠️ Merge conflict, resolving..."
            git checkout --ours .github/workflows/sync-upstream.yml || true
            git add .github/workflows/sync-upstream.yml || true
            git commit --no-edit || true
            echo "merged=true" >> $GITHUB_OUTPUT
          fi

      - name: Remove upstream-only workflows
        if: steps.merge.outputs.merged == 'true'
        run: |
          # notify.yml braucht Secrets die nur im Original-Repo existieren
          rm -f .github/workflows/notify.yml
          rm -f .github/workflows/devSync.yml
          echo "✅ Removed upstream-only workflows"

      - name: Apply Custom Overrides
        if: steps.merge.outputs.merged == 'true'
        run: |
          echo "Applying overrides to profiles..."

          # Basis-Profile von Upstream sicherstellen
          git checkout upstream/stable -- 'profiles/2160p Remux.yml'
          git checkout upstream/stable -- 'profiles/1080p Quality.yml'

          # ══════════════════════════════════════════
          # 2160p Remux Varianten
          # ══════════════════════════════════════════

          # ── Deutsch: Sprache Deutsch ──
          cp 'profiles/2160p Remux.yml' 'profiles/Deutsch.yml'
          yq -i '.language = "must_german" | .name = "Deutsch"' 'profiles/Deutsch.yml'
          echo "✅ Deutsch (must_german)"

          # ── Englisch: Sprache English ──
          cp 'profiles/2160p Remux.yml' 'profiles/Englisch.yml'
          yq -i '.language = "must_english" | .name = "Englisch"' 'profiles/Englisch.yml'
          echo "✅ Englisch (must_english)"

          # ── Original: Sprache Original ──
          cp 'profiles/2160p Remux.yml' 'profiles/Original.yml'
          yq -i '.language = "must_original" | .name = "Original"' 'profiles/Original.yml'
          echo "✅ Original (must_original)"

          # ══════════════════════════════════════════
          # Anime Varianten (basierend auf 1080p Quality)
          # ══════════════════════════════════════════

          # Anime Scoring das zu allen Anime-Profilen hinzugefügt wird
          ANIME_SCORING='[
            {"name": "Anime Bluray Tier 1", "score": 125000},
            {"name": "Anime Bluray Tier 2", "score": 124000},
            {"name": "Anime Bluray Tier 3", "score": 123000},
            {"name": "Anime Bluray Tier 4", "score": 122000},
            {"name": "Anime Bluray Tier 5", "score": 121000},
            {"name": "Anime WEB-DL Tier 1", "score": 85000},
            {"name": "Anime WEB-DL Tier 2", "score": 84000}
          ]'

          # ── Anime Deutsch ──
          cp 'profiles/1080p Quality.yml' 'profiles/Anime Deutsch.yml'
          yq -i ".language = \"must_german\" | .name = \"Anime Deutsch\" | .tags += [\"Anime\"] | .custom_formats += ${ANIME_SCORING}" 'profiles/Anime Deutsch.yml'
          echo "✅ Anime Deutsch (must_german)"

          # ── Anime Englisch ──
          cp 'profiles/1080p Quality.yml' 'profiles/Anime Englisch.yml'
          yq -i ".language = \"must_english\" | .name = \"Anime Englisch\" | .tags += [\"Anime\"] | .custom_formats += ${ANIME_SCORING}" 'profiles/Anime Englisch.yml'
          echo "✅ Anime Englisch (must_english)"

          # ── Anime Original ──
          cp 'profiles/1080p Quality.yml' 'profiles/Anime Original.yml'
          yq -i ".language = \"must_original\" | .name = \"Anime Original\" | .tags += [\"Anime\"] | .custom_formats += ${ANIME_SCORING}" 'profiles/Anime Original.yml'
          echo "✅ Anime Original (must_original)"

      - name: Commit & Push
        if: steps.merge.outputs.merged == 'true'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "chore: sync upstream + apply custom overrides"
            git push origin $(git branch --show-current)
          fi
